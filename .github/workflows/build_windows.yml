name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt5 + MinGW GCC + Make)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-qt5-svg
          mingw-w64-x86_64-qt5-translations

    - name: Add MSYS2 MinGW to PATH
      shell: powershell
      run: |
        "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Compile & Package qmtn (Powershell / Windows Native)
      shell: powershell
      run: |
        Write-Host "=== Environment Info ==="
        gcc --version
        qmake -v

        # 1. Compile Qt Translations (.ts -> .qm)
        New-Item -ItemType Directory -Force -Path lang, src\lang
        lrelease lang\zh_CN.ts -qm lang\zh_CN.qm
        lrelease lang\zh_CN.ts -qm src\lang\zh_CN.qm
        Copy-Item lang\zh_CN.qm src\lang\zh_CN.qm -Force

        # 2. Copy icon to src/
        Copy-Item icons\qmtn.ico src\qmtn.ico -Force

        # 3. Build with native qmake inside src/
        Set-Location src
        Write-Host "=== Running qmake ==="
        qmake mtngui.pro CONFIG+=release

        Write-Host "=== Running mingw32-make ==="
        mingw32-make -j2
        Set-Location ..

        # 4. Prepare dist directory and copy executable
        New-Item -ItemType Directory -Force -Path dist
        if (Test-Path src\release\qmtn.exe) {
            Copy-Item src\release\qmtn.exe dist\ -Force
        } elseif (Test-Path src\qmtn.exe) {
            Copy-Item src\qmtn.exe dist\ -Force
        } elseif (Test-Path release\qmtn.exe) {
            Copy-Item release\qmtn.exe dist\ -Force
        } else {
            Get-ChildItem -Recurse -Filter "qmtn.exe" | Copy-Item -Destination dist\ -Force
        }

        # 5. Check if qmtn.exe exists
        if (-not (Test-Path dist\qmtn.exe)) {
            Write-Error "ERROR: qmtn.exe was not created in dist!"
            exit 1
        }

        # 6. Deploy Qt DLL Dependencies
        windeployqt --no-compiler-runtime dist\qmtn.exe

        # Copy MinGW C++ runtime DLLs
        Copy-Item C:\msys64\mingw64\bin\libgcc_s_seh-1.dll dist\ -ErrorAction SilentlyContinue
        Copy-Item C:\msys64\mingw64\bin\libgcc_s_dw2-1.dll dist\ -ErrorAction SilentlyContinue
        Copy-Item C:\msys64\mingw64\bin\libstdc++-6.dll dist\ -ErrorAction SilentlyContinue
        Copy-Item C:\msys64\mingw64\bin\libwinpthread-1.dll dist\ -ErrorAction SilentlyContinue

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
