name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt5 + MinGW GCC + CMake + Ninja)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-qt5-svg
          mingw-w64-x86_64-qt5-translations

    - name: Compile & Package with CMake + Ninja
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"

        echo "=== Environment Info ==="
        which gcc cmake ninja lrelease windeployqt || true
        gcc --version || true
        cmake --version || true

        # 1. Compile Qt Translations (.ts -> .qm)
        mkdir -p lang src/lang
        lrelease lang/zh_CN.ts -qm lang/zh_CN.qm || true
        lrelease lang/zh_CN.ts -qm src/lang/zh_CN.qm || true
        cp lang/zh_CN.qm src/lang/zh_CN.qm || true

        # 2. Build with CMake + Ninja
        echo "=== Running CMake ==="
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

        echo "=== Running Ninja Build ==="
        cmake --build build --config Release

        # 3. Prepare dist directory and copy executable
        mkdir -p dist
        cp build/qmtn.exe dist/ 2>/dev/null || find build -name "qmtn.exe" -exec cp {} dist/ \;

        # 4. Check if qmtn.exe exists
        if [ ! -f "dist/qmtn.exe" ]; then
          echo "ERROR: qmtn.exe was not created in dist!"
          find build -name "*.exe" 2>/dev/null || true
          exit 1
        fi

        # 5. Deploy Qt DLL Dependencies
        windeployqt --no-compiler-runtime dist/qmtn.exe || true

        # Copy MinGW C++ runtime DLLs
        cp /mingw64/bin/libgcc_s_seh-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libgcc_s_dw2-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libstdc++-6.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libwinpthread-1.dll dist/ 2>/dev/null || true

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
