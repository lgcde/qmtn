name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt5 + GCC + Make)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-qt5-svg

    - name: Compile & Package in MSYS2
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"

        # 1. Compile Qt Translations (.ts -> .qm)
        mkdir -p src/lang lang
        lrelease lang/zh_CN.ts -qm lang/zh_CN.qm
        lrelease lang/zh_CN.ts -qm src/lang/zh_CN.qm
        [ -f lang/sk.ts ] && lrelease lang/sk.ts -qm lang/sk.qm 2>/dev/null || true
        [ -f lang/sk.ts ] && lrelease lang/sk.ts -qm src/lang/sk.qm 2>/dev/null || true

        # 2. Copy icon file to src/ to guarantee windres finds qmtn.ico
        cp icons/qmtn.ico src/qmtn.ico 2>/dev/null || true

        # 3. Build with qmake & mingw32-make inside src/
        cd src
        qmake mtngui.pro CONFIG+=release
        mingw32-make -j2 || mingw32-make
        cd ..

        # 4. Prepare dist directory and copy executable
        mkdir -p dist
        cp src/release/qmtn.exe dist/ 2>/dev/null || cp src/qmtn.exe dist/ 2>/dev/null || cp release/qmtn.exe dist/ 2>/dev/null || cp qmtn.exe dist/ 2>/dev/null || true

        # 5. Check if qmtn.exe exists
        if [ ! -f "dist/qmtn.exe" ]; then
          echo "ERROR: qmtn.exe was not created in dist!"
          find . -name "*.exe" 2>/dev/null || true
          exit 1
        fi

        # 6. Deploy Qt DLL Dependencies
        windeployqt dist/qmtn.exe || true

        # Copy MinGW C++ runtime DLLs
        cp /mingw64/bin/libgcc_s_seh-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libgcc_s_dw2-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libstdc++-6.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libwinpthread-1.dll dist/ 2>/dev/null || true

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
