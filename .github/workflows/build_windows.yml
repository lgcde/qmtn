name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt6 + GCC)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-tools
          mingw-w64-x86_64-qt6-svg

    - name: Compile & Package in MSYS2
      shell: msys2 {0}
      run: |
        # 1. Compile Qt Translation
        lrelease lang/zh_CN.ts -qm lang/zh_CN.qm
        
        # 2. Build with qmake6 & make
        qmake6 src/mtngui.pro CONFIG+=release
        make -j4

        # 3. Deploy Qt Dependencies
        mkdir -p dist
        cp release/qmtn.exe dist/
        windeployqt dist/qmtn.exe --compiler-runtime

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
