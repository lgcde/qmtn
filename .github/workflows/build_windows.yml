name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt5 + GCC + Ninja + CMake)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-qt5-svg

    - name: Compile & Package
      shell: powershell
      run: |
        $env:CMAKE_PREFIX_PATH = "C:\msys64\mingw64"
        $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:PATH

        # 1. Compile Qt Translations (.ts -> .qm)
        New-Item -ItemType Directory -Force -Path src/lang, lang | Out-Null
        lrelease lang/zh_CN.ts -qm lang/zh_CN.qm
        lrelease lang/zh_CN.ts -qm src/lang/zh_CN.qm

        # 2. Try Build with CMake and Ninja
        Write-Host "--- Attempting CMake Ninja Build ---"
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/msys64/mingw64"
        cmake --build build --config Release

        # 3. Fallback to qmake if CMake output is missing
        if (-not (Test-Path build/qmtn.exe)) {
            Write-Host "--- Falling back to qmake build ---"
            Set-Location src
            Copy-Item ../icons/qmtn.ico qmtn.ico -ErrorAction SilentlyContinue
            qmake mtngui.pro CONFIG+=release
            mingw32-make
            Set-Location ..
        }

        # 4. Prepare dist directory and copy executable
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        if (Test-Path build/qmtn.exe) {
            Copy-Item build/qmtn.exe dist/
        } elseif (Test-Path src/release/qmtn.exe) {
            Copy-Item src/release/qmtn.exe dist/
        } elseif (Test-Path src/qmtn.exe) {
            Copy-Item src/qmtn.exe dist/
        } else {
            Get-ChildItem -Path . -Filter "qmtn.exe" -Recurse | Copy-Item -Destination dist/
        }

        # 5. Check if qmtn.exe exists
        if (-not (Test-Path dist/qmtn.exe)) {
            Write-Host "Listing repository files:"
            Get-ChildItem -Path . -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
            Write-Error "ERROR: qmtn.exe was not created!"
            exit 1
        }

        # 6. Deploy Qt DLL Dependencies
        windeployqt dist/qmtn.exe

        # Copy MinGW C++ runtime DLLs
        Copy-Item C:\msys64\mingw64\bin\libgcc_s_seh-1.dll dist/ -ErrorAction SilentlyContinue
        Copy-Item C:\msys64\mingw64\bin\libgcc_s_dw2-1.dll dist/ -ErrorAction SilentlyContinue
        Copy-Item C:\msys64\mingw64\bin\libstdc++-6.dll dist/ -ErrorAction SilentlyContinue
        Copy-Item C:\msys64\mingw64\bin\libwinpthread-1.dll dist/ -ErrorAction SilentlyContinue

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
