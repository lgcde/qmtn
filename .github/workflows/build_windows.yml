name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt5 + MinGW GCC + Make)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: false
        install: >-
          make
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-qt5-svg
          mingw-w64-x86_64-qt5-translations

    - name: Compile & Package in MSYS2
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"

        echo "=== Environment Info ==="
        which gcc qmake make windeployqt || true
        gcc --version || true
        qmake -v || true

        # 1. Compile Qt Translations (.ts -> .qm)
        mkdir -p lang src/lang
        lrelease lang/zh_CN.ts -qm lang/zh_CN.qm || true
        lrelease lang/zh_CN.ts -qm src/lang/zh_CN.qm || true
        lrelease lang/sk.ts -qm lang/sk.qm 2>/dev/null || true
        cp lang/zh_CN.qm src/lang/zh_CN.qm || true
        cp lang/sk.qm src/lang/sk.qm || true

        # 2. Ensure .qm files exist in both root and src
        touch lang/sk.qm lang/zh_CN.qm src/lang/zh_CN.qm src/lang/sk.qm

        # 3. Copy icon to src/
        cp icons/qmtn.ico src/qmtn.ico || true

        # 4. Build with native qmake inside src/
        echo "=== Running qmake ==="
        cd src
        qmake mtngui.pro CONFIG+=release

        echo "=== Running make ==="
        mingw32-make -j2
        cd ..

        # 5. Prepare dist directory and copy executable
        mkdir -p dist
        cp src/release/qmtn.exe dist/ 2>/dev/null || cp src/qmtn.exe dist/ 2>/dev/null || cp release/qmtn.exe dist/ 2>/dev/null || find . -name "qmtn.exe" -exec cp {} dist/ \;

        # 6. Check if qmtn.exe exists
        if [ ! -f "dist/qmtn.exe" ]; then
          echo "ERROR: qmtn.exe was not created in dist!"
          find . -name "*.exe" 2>/dev/null || true
          exit 1
        fi

        # 7. Deploy Qt DLL Dependencies
        windeployqt dist/qmtn.exe || true

        # Copy MinGW C++ runtime DLLs
        cp /mingw64/bin/libgcc_s_seh-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libgcc_s_dw2-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libstdc++-6.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libwinpthread-1.dll dist/ 2>/dev/null || true

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
