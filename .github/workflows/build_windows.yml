name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt6 + GCC + CMake + Ninja)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-tools
          mingw-w64-x86_64-qt6-svg

    - name: Compile & Package in MSYS2
      shell: msys2 {0}
      run: |
        set -x

        # 1. Compile Qt Translation (.ts -> .qm)
        if command -v lrelease-qt6 >/dev/null 2>&1; then
          lrelease-qt6 lang/zh_CN.ts -qm lang/zh_CN.qm
        elif command -v lrelease >/dev/null 2>&1; then
          lrelease lang/zh_CN.ts -qm lang/zh_CN.qm
        fi

        # 2. Configure & Build with CMake & Ninja
        mkdir build && cd build
        cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        cmake --build . -j4
        cd ..

        # 3. Prepare dist directory and copy executable
        mkdir -p dist
        if [ -f "build/qmtn.exe" ]; then
          cp build/qmtn.exe dist/
        elif [ -f "src/qmtn.exe" ]; then
          cp src/qmtn.exe dist/
        fi

        # 4. Deploy Qt6 DLL Dependencies
        if command -v windeployqt-qt6 >/dev/null 2>&1; then
          windeployqt-qt6 dist/qmtn.exe || true
        elif command -v windeployqt >/dev/null 2>&1; then
          windeployqt dist/qmtn.exe || true
        fi

        # Copy MinGW C++ runtime DLLs
        cp /mingw64/bin/libgcc_s_seh-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libstdc++-6.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libwinpthread-1.dll dist/ 2>/dev/null || true

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
