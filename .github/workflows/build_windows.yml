name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt5 + MinGW GCC + Make)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-qt5-svg
          mingw-w64-x86_64-qt5-translations

    - name: Compile & Package qmtn
      shell: cmd
      run: |
        set PATH=C:\msys64\mingw64\bin;C:\msys64\usr\bin;%PATH%

        echo === Environment Info ===
        gcc --version
        qmake -v

        echo === Compile Qt Translations ===
        if not exist lang mkdir lang
        if not exist src\lang mkdir src\lang
        lrelease lang\zh_CN.ts -qm lang\zh_CN.qm
        lrelease lang\zh_CN.ts -qm src\lang\zh_CN.qm
        copy /Y lang\zh_CN.qm src\lang\zh_CN.qm

        echo === Copy Icon ===
        copy /Y icons\qmtn.ico src\qmtn.ico

        echo === Running qmake ===
        cd src
        qmake mtngui.pro CONFIG+=release

        echo === Running mingw32-make ===
        mingw32-make -j2
        cd ..

        echo === Prepare dist ===
        if not exist dist mkdir dist
        if exist src\release\qmtn.exe copy /Y src\release\qmtn.exe dist\
        if exist src\qmtn.exe copy /Y src\qmtn.exe dist\
        if exist release\qmtn.exe copy /Y release\qmtn.exe dist\

        if not exist dist\qmtn.exe (
            echo ERROR: dist\qmtn.exe not found!
            exit /b 1
        )

        echo === Deploy Qt Dependencies ===
        windeployqt --no-compiler-runtime dist\qmtn.exe

        if exist C:\msys64\mingw64\bin\libgcc_s_seh-1.dll copy /Y C:\msys64\mingw64\bin\libgcc_s_seh-1.dll dist\
        if exist C:\msys64\mingw64\bin\libgcc_s_dw2-1.dll copy /Y C:\msys64\mingw64\bin\libgcc_s_dw2-1.dll dist\
        if exist C:\msys64\mingw64\bin\libstdc++-6.dll copy /Y C:\msys64\mingw64\bin\libstdc++-6.dll dist\
        if exist C:\msys64\mingw64\bin\libwinpthread-1.dll copy /Y C:\msys64\mingw64\bin\libwinpthread-1.dll dist\

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
