name: Build Windows Chinese Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Environment (Qt5 + GCC + Make)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-qt5-svg

    - name: Compile & Package in MSYS2
      shell: msys2 {0}
      run: |
        set -x
        export PATH="/mingw64/bin:$PATH"

        # 1. Compile Qt Translation (.ts -> .qm)
        mkdir -p src/lang
        if command -v lrelease >/dev/null 2>&1; then
          lrelease lang/zh_CN.ts -qm lang/zh_CN.qm || true
          lrelease lang/zh_CN.ts -qm src/lang/zh_CN.qm || true
        elif command -v lrelease-qt5 >/dev/null 2>&1; then
          lrelease-qt5 lang/zh_CN.ts -qm lang/zh_CN.qm || true
          lrelease-qt5 lang/zh_CN.ts -qm src/lang/zh_CN.qm || true
        fi

        # 2. Build with qmake inside src/
        cd src
        if command -v qmake >/dev/null 2>&1; then
          qmake mtngui.pro CONFIG+=release
        elif command -v qmake-qt5 >/dev/null 2>&1; then
          qmake-qt5 mtngui.pro CONFIG+=release
        fi

        if command -v make >/dev/null 2>&1; then
          make -j4
        elif command -v mingw32-make >/dev/null 2>&1; then
          mingw32-make -j4
        fi
        cd ..

        # 3. Prepare dist directory and copy executable
        mkdir -p dist
        find . -name "qmtn.exe" -exec cp {} dist/ \;

        # 4. Check if qmtn.exe exists
        if [ ! -f "dist/qmtn.exe" ]; then
          echo "ERROR: qmtn.exe was not created!"
          exit 1
        fi

        # 5. Deploy Qt DLL Dependencies
        if command -v windeployqt >/dev/null 2>&1; then
          windeployqt dist/qmtn.exe || true
        elif command -v windeployqt-qt5 >/dev/null 2>&1; then
          windeployqt-qt5 dist/qmtn.exe || true
        fi

        # Copy MinGW C++ runtime DLLs
        cp /mingw64/bin/libgcc_s_seh-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libgcc_s_dw2-1.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libstdc++-6.dll dist/ 2>/dev/null || true
        cp /mingw64/bin/libwinpthread-1.dll dist/ 2>/dev/null || true

    - name: Create Zip Artifact
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath qmtn_v0.5_Windows_zh_CN.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qmtn_v0.5_Windows_zh_CN
        path: qmtn_v0.5_Windows_zh_CN.zip
